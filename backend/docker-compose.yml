version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: econav_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=econav
      - POSTGRES_PASSWORD=econav_secret_pass
      - POSTGRES_DB=econavigators
      - POSTGRES_PORT=5432
      - USE_MOCK_DATA=true
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgis/postgis:16-3.4
    container_name: econav_postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=econav
      - POSTGRES_PASSWORD=econav_secret_pass
      - POSTGRES_DB=econavigators
    volumes:
      - postgis_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: econav_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgis_data:
